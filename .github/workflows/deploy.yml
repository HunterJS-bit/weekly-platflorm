name: Deploy CMS to Dokploy

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    environment: prod

    # `environment: <name>` below if they are environment-level secrets).
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
      NEXT_PUBLIC_SERVER_URL: ${{ secrets.NEXT_PUBLIC_SERVER_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      PREVIEW_SECRET: ${{ secrets.PREVIEW_SECRET }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Validate required secrets
        run: |
          missing=0
          for name in DATABASE_URL PAYLOAD_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is empty. Add it under Settings -> Secrets and variables -> Actions."
              missing=1
            fi
          done
          exit "$missing"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Payload types
        run: pnpm run generate:types

      - name: Build application
        run: pnpm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            .next
            public
            package.json
            pnpm-lock.yaml
          retention-days: 1

