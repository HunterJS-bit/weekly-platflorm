name: Build and Deploy

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The build is database-free by design. Point at a host that does not exist so
  # any accidental build-time query fails immediately instead of silently
  # depending on a production database.
  DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
  PAYLOAD_SECRET: ci-build-only-secret
  CRON_SECRET: ci-build-only-cron-secret
  PREVIEW_SECRET: ci-build-only-preview-secret

jobs:
  build:
    name: Build Next.js app
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      packages: write
    env:
      NEXT_PUBLIC_SERVER_URL: ${{ secrets.NEXT_PUBLIC_SERVER_URL || 'https://example.com' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Build application
        run: pnpm run build


  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: build
    environment: prod
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/hunterjs-bit/weekly-platflorm:latest
            ghcr.io/hunterjs-bit/weekly-platflorm:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SERVER_URL=${{ secrets.NEXT_PUBLIC_SERVER_URL || 'https://example.com' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Update Dokploy and trigger deployment
    runs-on: ubuntu-latest
    needs:
      - build
      - docker
    environment: prod
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Validate Required Secrets
        run: |
          REQUIRED_SECRETS=(
            "DATABASE_URL"
            "PAYLOAD_SECRET"
            "CRON_SECRET"
            "PREVIEW_SECRET"
          )
          OPTIONAL_SECRETS=(
            "NEXT_PUBLIC_SERVER_URL"
            "R2_ACCESS_KEY_ID"
            "R2_SECRET_ACCESS_KEY"
            "R2_BUCKET_NAME"
            "R2_ENDPOINT"
            "R2_PUBLIC_URL"
            "R2_BACKUP_BUCKET_NAME"
            "R2_BACKUP_RETENTION_DAYS"
          )
          
          MISSING=()
          for secret in "${REQUIRED_SECRETS[@]}"; do
            if [ -z "${!secret}" ]; then
              MISSING+=("$secret")
            fi
          done
          
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "❌ Missing required secrets: ${MISSING[*]}"
            exit 1
          fi
          
          echo "✅ All required secrets are set"
          
          for secret in "${OPTIONAL_SECRETS[@]}"; do
            if [ -z "${!secret}" ]; then
              echo "⚠️  Optional secret not set: $secret (will use fallback)"
            fi
          done

      - name: Update Environment Variables in Dokploy
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_APP_ID: ${{ secrets.DOKPLOY_APP_ID }}
        run: |
          if [ -n "$DOKPLOY_URL" ] && [ -n "$DOKPLOY_API_KEY" ] && [ -n "$DOKPLOY_APP_ID" ]; then
            echo "Updating environment variables for application ID: $DOKPLOY_APP_ID"
            curl --fail -X POST "${DOKPLOY_URL}/api/application.update" \
              -H "accept: application/json" \
              -H "x-api-key: $DOKPLOY_API_KEY" \
              -H "Content-Type: application/json" \
              -d "{
                \"applicationId\": \"$DOKPLOY_APP_ID\",
                \"env\": \"\nNODE_ENV=production\nDATABASE_URL=${{ secrets.DATABASE_URL }}\nPAYLOAD_SECRET=${{ secrets.PAYLOAD_SECRET }}\nCRON_SECRET=${{ secrets.CRON_SECRET }}\nPREVIEW_SECRET=${{ secrets.PREVIEW_SECRET }}\nNEXT_PUBLIC_SERVER_URL=${{ secrets.NEXT_PUBLIC_SERVER_URL }}\nR2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}\nR2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}\nR2_BUCKET_NAME=${{ secrets.R2_BUCKET_NAME }}\nR2_ENDPOINT=${{ secrets.R2_ENDPOINT }}\nR2_PUBLIC_URL=${{ secrets.R2_PUBLIC_URL }}\nR2_BACKUP_BUCKET_NAME=${{ secrets.R2_BACKUP_BUCKET_NAME }}\nR2_BACKUP_RETENTION_DAYS=${{ secrets.R2_BACKUP_RETENTION_DAYS }}\"
              }"
          else
            echo "Error: DOKPLOY_URL, DOKPLOY_API_KEY, or DOKPLOY_APP_ID not configured"
            exit 1
          fi

      - name: Trigger Dokploy Deployment
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_APP_ID: ${{ secrets.DOKPLOY_APP_ID }}
        run: |
          if [ -n "$DOKPLOY_URL" ] && [ -n "$DOKPLOY_API_KEY" ] && [ -n "$DOKPLOY_APP_ID" ]; then
            echo "Triggering deployment for application ID: $DOKPLOY_APP_ID"
            curl --fail -X POST "${DOKPLOY_URL}/api/application.deploy" \
              -H "accept: application/json" \
              -H "x-api-key: $DOKPLOY_API_KEY" \
              -H "Content-Type: application/json" \
              -d "{
                \"applicationId\": \"$DOKPLOY_APP_ID\"
              }"
          else
            echo "Error: DOKPLOY_URL, DOKPLOY_API_KEY, or DOKPLOY_APP_ID not configured"
            exit 1
          fi
